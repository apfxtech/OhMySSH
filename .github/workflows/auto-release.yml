name: Android, iOS, Linux, macOS, and Windows prerelease

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Check GitHub server
    runs-on: ubuntu-latest
    steps:
      - name: Cancel outside github.com
        if: ${{ github.server_url != 'https://github.com' }}
        run: |
          echo "Unsupported GitHub server: ${GITHUB_SERVER_URL}"
          exit 1

      - name: Confirm github.com
        if: ${{ github.server_url == 'https://github.com' }}
        run: echo "Running on ${{ github.server_url }}"

  build-android-linux:
    name: Build Android and Linux releases
    needs: guard
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive app version from tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::error::Tag must contain a semantic version like 1.6.1, alpha-1.6.1, or v1.6.1."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( 10#$major < 1 )); then
            echo "::error::Tag version must start at 1 or above: jpackage rejects a macOS bundle version that starts with 0."
            exit 1
          fi

          version_name="${major}.${minor}.${patch}"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))

          if (( version_code <= 0 )); then
            echo "::error::Derived Android versionCode must be greater than zero."
            exit 1
          fi

          {
            echo "OHMYSSH_VERSION_NAME=$version_name"
            echo "OHMYSSH_VERSION_CODE=$version_code"
            echo "OHMYSSH_RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

          echo "Version name: $version_name"
          echo "Version code: $version_code"

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are not configured. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub repository secrets."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > androidApp/upload-keystore.jks

          {
            echo "storeFile=upload-keystore.jks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > androidApp/key.properties

      - name: Build Android release APK
        run: .github/scripts/build/android.sh

      - name: Build Linux single-file executable
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        run: .github/scripts/build/linux.sh

      - name: Upload Android and Linux release assets
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-android-linux
          path: |
            dist/ohmyssh_*_android_*.apk
            dist/ohmyssh_*_linux_x64
          if-no-files-found: warn

  build-windows:
    name: Build Windows release
    needs: guard
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive app version from tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::error::Tag must contain a semantic version like 1.6.1, alpha-1.6.1, or v1.6.1."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( 10#$major < 1 )); then
            echo "::error::Tag version must start at 1 or above: jpackage rejects a macOS bundle version that starts with 0."
            exit 1
          fi

          version_name="${major}.${minor}.${patch}"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))

          if (( version_code <= 0 )); then
            echo "::error::Derived build number must be greater than zero."
            exit 1
          fi

          {
            echo "OHMYSSH_VERSION_NAME=$version_name"
            echo "OHMYSSH_VERSION_CODE=$version_code"
            echo "OHMYSSH_RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

          echo "Version name: $version_name"
          echo "Build number: $version_code"

      - name: Build Windows raw ZIP and packaged EXE
        shell: pwsh
        run: ./.github/scripts/build/windows.ps1

      - name: Upload Windows release asset
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: |
            dist/ohmyssh_*_windows_x64_raw.zip
            dist/ohmyssh_*_windows_x64.exe
          if-no-files-found: warn

  build-macos:
    name: Build macOS and iOS releases
    needs: guard
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive app version from tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::error::Tag must contain a semantic version like 1.6.1, alpha-1.6.1, or v1.6.1."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( 10#$major < 1 )); then
            echo "::error::Tag version must start at 1 or above: jpackage rejects a macOS bundle version that starts with 0."
            exit 1
          fi

          version_name="${major}.${minor}.${patch}"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))

          if (( version_code <= 0 )); then
            echo "::error::Derived build number must be greater than zero."
            exit 1
          fi

          {
            echo "OHMYSSH_VERSION_NAME=$version_name"
            echo "OHMYSSH_VERSION_CODE=$version_code"
            echo "OHMYSSH_RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

          echo "Version name: $version_name"
          echo "Build number: $version_code"

      - name: Build macOS release
        run: .github/scripts/build/macos.sh

      - name: Build iOS release IPA
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        run: .github/scripts/build/ios.sh

      - name: Upload macOS and iOS release assets
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: |
            dist/ohmyssh_*_macos_*.dmg
            dist/ohmyssh_*_ios_*.ipa
          if-no-files-found: warn

  publish:
    name: Publish GitHub prerelease
    needs:
      - guard
      - build-android-linux
      - build-macos
      - build-windows
    if: ${{ !cancelled() && needs.guard.result == 'success' && github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download release assets
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-assets-*
          merge-multiple: true

      - name: Summarize built assets
        id: assets
        shell: bash
        run: |
          shopt -s nullglob

          expected=(
            "Android:dist/ohmyssh_*_android_*.apk"
            "iOS:dist/ohmyssh_*_ios_*.ipa"
            "Linux:dist/ohmyssh_*_linux_x64"
            "macOS:dist/ohmyssh_*_macos_*.dmg"
            "Windows:dist/ohmyssh_*_windows_x64*"
          )

          missing=()
          found=0
          for entry in "${expected[@]}"; do
            platform="${entry%%:*}"
            files=(${entry#*:})
            if (( ${#files[@]} )); then
              found=$(( found + ${#files[@]} ))
              printf 'Built %s: %s\n' "$platform" "${files[*]}"
            else
              missing+=("$platform")
              printf 'Missing %s\n' "$platform"
            fi
          done

          if (( found == 0 )); then
            echo "::error::No release assets were built, nothing to publish."
            exit 1
          fi

          if (( ${#missing[@]} )); then
            missing_list="$(printf '%s, ' "${missing[@]}")"
            missing_list="${missing_list%, }"

            {
              printf 'notes<<OHMYSSH_NOTES\n'
              printf '> Builds failed for: %s. Assets for those platforms are missing from this prerelease.\n' "$missing_list"
              printf 'OHMYSSH_NOTES\n'
            } >> "$GITHUB_OUTPUT"

            echo "::warning::Publishing a partial prerelease, missing: $missing_list"
          fi

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
          body: ${{ steps.assets.outputs.notes }}
          fail_on_unmatched_files: false
          files: |
            dist/ohmyssh_*_android_*.apk
            dist/ohmyssh_*_ios_*.ipa
            dist/ohmyssh_*_linux_x64
            dist/ohmyssh_*_macos_*.dmg
            dist/ohmyssh_*_windows_x64_raw.zip
            dist/ohmyssh_*_windows_x64.exe

  sync-version:
    name: Sync project version with tag
    needs: publish
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update project version from tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::error::Tag must contain a semantic version like 1.6.1, alpha-1.6.1, or v1.6.1."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( 10#$major < 1 )); then
            echo "::error::Tag version must start at 1 or above: jpackage rejects a macOS bundle version that starts with 0."
            exit 1
          fi

          version_name="${major}.${minor}.${patch}"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          target="${version_name}+${version_code}"

          sed -i -E "s/^ohmysshVersionName=.*/ohmysshVersionName=$version_name/" gradle.properties
          sed -i -E "s/^ohmysshVersionCode=.*/ohmysshVersionCode=$version_code/" gradle.properties
          sed -i -E "s/^MARKETING_VERSION=.*/MARKETING_VERSION=$version_name/" iosApp/Configuration/Config.xcconfig
          sed -i -E "s/^CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=$version_code/" iosApp/Configuration/Config.xcconfig

          if git diff --quiet; then
            echo "Project already at version $target"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump version to $target" gradle.properties iosApp/Configuration/Config.xcconfig
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
